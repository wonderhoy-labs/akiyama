name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  cli:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # There's no C in the tool, so the Linux builds are static and run on any distribution.
      - name: Link with the linker Rust ships
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C linker=rust-lld" >> "$GITHUB_ENV"
      - run: cargo build --release -p akiyama --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        run: tar -czf akiyama-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release akiyama
      - name: Package for Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/akiyama.exe -DestinationPath akiyama-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: akiyama-${{ matrix.target }}
          path: akiyama-${{ matrix.target }}.*

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Install the Android platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;30.0.16248370"
      # To sign with your own key, add the repository secrets AKIYAMA_KEYSTORE_BASE64,
      # AKIYAMA_KEYSTORE_PASSWORD, AKIYAMA_KEY_ALIAS and AKIYAMA_KEY_PASSWORD. Without them the APK uses a
      # throwaway debug key, so each release has to be installed fresh instead of updating.
      - name: Build
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.AKIYAMA_KEYSTORE_BASE64 }}
          AKIYAMA_KEYSTORE_PASSWORD: ${{ secrets.AKIYAMA_KEYSTORE_PASSWORD }}
          AKIYAMA_KEY_ALIAS: ${{ secrets.AKIYAMA_KEY_ALIAS }}
          AKIYAMA_KEY_PASSWORD: ${{ secrets.AKIYAMA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export AKIYAMA_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - name: Rename the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk akiyama.apk
      - uses: actions/upload-artifact@v4
        with:
          name: akiyama-apk
          path: akiyama.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mv akiyama.apk "akiyama-$TAG.apk"
          sha256sum -- *.tar.gz *.zip *.apk > SHA256SUMS
          gh release create "$TAG" --repo "$REPOSITORY" --title "Akiyama ${TAG#v}" --verify-tag --generate-notes \
            -- *.tar.gz *.zip *.apk SHA256SUMS
