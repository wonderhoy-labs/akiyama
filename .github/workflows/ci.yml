name: CI

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    checks:
        uses: wonderhoy-labs/.github/.github/workflows/checks.yml@main

    # macOS and Linux can be either end; Windows is server-only, through adb. All on x86_64 and ARM.
    rust:
        uses: wonderhoy-labs/.github/.github/workflows/rust.yml@main
        with:
            test-os: '["ubuntu-24.04", "macos-latest", "windows-latest"]'
            package: akiyama
            # There's no C in the tool, so the Linux builds are static and run on any distribution.
            linux-rustflags: -C linker=rust-lld
            targets: >-
                [
                  {"os": "ubuntu-24.04", "target": "x86_64-unknown-linux-musl"},
                  {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-musl"},
                  {"os": "macos-latest", "target": "aarch64-apple-darwin"},
                  {"os": "macos-latest", "target": "x86_64-apple-darwin"},
                  {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"},
                  {"os": "windows-11-arm", "target": "aarch64-pc-windows-msvc"}
                ]

    android:
        uses: wonderhoy-labs/.github/.github/workflows/android.yml@main
        with:
            name: akiyama
            env-prefix: AKIYAMA
            rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
            gradle-tasks: spotlessCheck :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:lintRelease :app:assembleRelease
        secrets:
            KEYSTORE_BASE64: ${{ secrets.AKIYAMA_KEYSTORE_BASE64 }}
            KEYSTORE_PASSWORD: ${{ secrets.AKIYAMA_KEYSTORE_PASSWORD }}
            KEY_ALIAS: ${{ secrets.AKIYAMA_KEY_ALIAS }}
            KEY_PASSWORD: ${{ secrets.AKIYAMA_KEY_PASSWORD }}

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [checks, rust, android]
        permissions:
            contents: write
            id-token: write
            attestations: write
        uses: wonderhoy-labs/.github/.github/workflows/release.yml@main
        with:
            title: Akiyama
